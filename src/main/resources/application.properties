spring.application.name=LeadGeneration

# =====================================================================
# 1. SERVER
# =====================================================================
server.port=${SERVER_PORT:8080}

# =====================================================================
# 2. DATABASE CONNECTION (DATASOURCE)
# =====================================================================
# Credentials come from environment variables — no secrets live in source code.
# For production, always provide DB_URL / DB_USERNAME / DB_PASSWORD explicitly
# (e.g. an SSL-enabled JDBC URL instead of the local dev default below).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lead_generation?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0000}

# =====================================================================
# 3. JPA & HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Controls automatic table creation/modification strategy.
#   update  -> dev only, Hibernate syncs the schema
#   validate-> production, fails fast if the schema does not match the entities
# The production profile (application-prod.properties) defaults this to validate.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

# Debug SQL logging — off by default. Enable only in dev via env var.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# =====================================================================
# 4. GOOGLE SHEETS (daily reporting/export destination)
#    The daily export job (@Scheduled 12:00 PM Asia/Kolkata in
#    scheduler/DailyExportScheduler.java) appends new records to this
#    spreadsheet via the Google Sheets API. It is NOT part of the
#    customer submission flow.
#    All values come from environment variables / OS-level config.
#    e.g. PowerShell:
#      $env:GOOGLE_SHEETS_CREDENTIALS="C:\keys\btech-sheets-credentials.json"
#      $env:GOOGLE_SHEETS_SPREADSHEET_ID="1KwAI9b8Kvgx_t2V7Tpc4PZJjxkhnGZTZ84a0MMTEsdQ"
# =====================================================================
google.sheets.credentials.file=${GOOGLE_SHEETS_CREDENTIALS:./credentials/service-account.json}
google.sheets.spreadsheet.id=${GOOGLE_SHEETS_SPREADSHEET_ID:1KwAI9b8Kvgx_t2V7Tpc4PZJjxkhnGZTZ84a0MMTEsdQ}
# Tab inside the spreadsheet that receives ALL exported leads (one unified 14-column
# layout: Timestamp, Type, Full Name, Mobile, Email, Loan Type, Loan Amount,
# Employment Type, Monthly Income, City, Subject, Message, Consent, Status).
google.sheets.export.tab=${GOOGLE_SHEETS_TAB:LoanApplications}

