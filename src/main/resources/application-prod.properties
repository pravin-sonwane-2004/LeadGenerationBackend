# =====================================================================
# Production profile — activate with:
#   --spring.profiles.active=prod
# or the SPRING_PROFILES_ACTIVE environment variable.
#
# Deployed with MySQL as the single source of truth. The schema is managed
# by migrations (see docs/DEPLOYMENT.md); Hibernate never alters tables here.
# =====================================================================

# Never auto-create/alter tables in production. Fail fast on schema drift.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}

# No debug SQL logging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Do not keep the Hibernate session open across the whole request/response.
spring.jpa.open-in-view=false

# Saner Hikari defaults for a production deployment (all env-overridable).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}

# Request logging of the public endpoints.
logging.level.org.springframework.web=INFO
